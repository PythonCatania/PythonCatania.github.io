@if (visible()) {
  <div
    role="dialog"
    aria-live="polite"
    aria-label="cookieconsent"
    aria-describedby="cookieconsent-description"
    class="fixed inset-x-4 bottom-4 z-50 flex flex-col gap-4 rounded-(--radius) border border-(--border) border-t-4 border-t-(--color-primary) bg-(--surface) p-4 text-base shadow-lg sm:left-auto sm:max-w-sm"
  >
    <span id="cookieconsent-description">
      {{ 'cookieConsent.message' | transloco }}
      <a
        routerLink="/privacy-policy"
        [attr.aria-label]="'cookieConsent.learnMoreLabel' | transloco"
      >
        {{ 'cookieConsent.learnMore' | transloco }}
      </a>
    </span>
    <button
      type="button"
      (click)="dismiss()"
      [attr.aria-label]="'cookieConsent.dismissLabel' | transloco"
      class="cursor-pointer self-stretch rounded-(--radius) border-2 border-(--color-primary) bg-(--color-primary) px-4 py-2 font-semibold text-white transition-colors hover:border-(--color-primary-hover) hover:bg-(--color-primary-hover)"
    >
      {{ 'cookieConsent.dismiss' | transloco }}
    </button>
  </div>
}
